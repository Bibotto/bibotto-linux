# Bibotto Linux - Calamares Mount Configuration

extraMounts:
    - device: proc
      fs: proc
      mountPoint: /proc

    - device: sys
      fs: sysfs
      mountPoint: /sys

    - device: /dev
      mountPoint: /dev
      options: [ bind ]

    - device: tmpfs
      fs: tmpfs
      mountPoint: /run

    - device: /run/udev
      mountPoint: /run/udev
      options: [ bind ]

    - device: efivarfs
      fs: efivarfs
      mountPoint: /sys/firmware/efi/efivars
      efi: true

    - device: /dev/pts
      mountPoint: /dev/pts
      options: [ bind ]

btrfsSubvolumes:
    - mountPoint: /
      subvolume: /@

    - mountPoint: /home
      subvolume: /@home

mountOptions:
    - filesystem: btrfs
      options:
          - noatime
          - compress=zstd

    - filesystem: ext4
      options:
          - noatime

    - filesystem: efi
      options:
          - umask=0077
