---
dontChroot: true
timeout: 180
verbose: true
emergency: true

script: |
    set -u

    ROOT="${ROOT:-}"

    if [ -z "$ROOT" ] || [ ! -d "$ROOT" ]; then
        echo "WARNING: Target root is unavailable; cleanup skipped."
        exit 0
    fi

    BACKUP="$ROOT/var/tmp/bibotto-apt-sources-backup"
    MARKER="$BACKUP/.bibotto-transaction"
    SOURCE_DIR="$ROOT/etc/apt/sources.list.d"

    if [ ! -f "$MARKER" ]; then
        echo "No active Bibotto repository transaction; nothing to clean."
        exit 0
    fi

    ERRORS=0

    if chroot "$ROOT" apt-get clean; then
        echo "APT cache cleaned."
    else
        echo "WARNING: apt-get clean failed."
        ERRORS=1
    fi

    if rm -f "$SOURCE_DIR/bibotto-offline.list" \
        "$SOURCE_DIR/.bibotto-offline.list.tmp"; then
        echo "Bibotto temporary APT source removed."
    else
        echo "WARNING: Could not remove temporary APT source."
        ERRORS=1
    fi

    if [ -f "$BACKUP/sources.list" ]; then
        if mv "$BACKUP/sources.list" "$ROOT/etc/apt/sources.list"; then
            echo "Original sources.list restored."
        else
            echo "WARNING: Could not restore sources.list."
            ERRORS=1
        fi
    fi

    if [ -d "$BACKUP" ]; then
        if mkdir -p "$SOURCE_DIR" &&
            find "$BACKUP" -maxdepth 1 -type f \
                \( -name '*.list' -o -name '*.sources' \) \
                -exec mv -t "$SOURCE_DIR" {} +
        then
            echo "Original APT source fragments restored."
        else
            echo "WARNING: Some APT source fragments could not be restored."
            ERRORS=1
        fi

        REMAINING="$(find "$BACKUP" -maxdepth 1 -type f \
            \( -name 'sources.list' -o -name '*.list' -o -name '*.sources' \) \
            -print -quit)"

        if [ -z "$REMAINING" ]; then
            if rm -rf "$BACKUP"; then
                echo "APT source backup and transaction marker removed."
            else
                echo "WARNING: Could not remove APT source backup."
                ERRORS=1
            fi
        else
            echo "WARNING: Unrestored source backups were preserved."
            ERRORS=1
        fi
    fi

    if rm -rf "$ROOT/var/cache/bibotto-repo"; then
        echo "Offline repository cache removed."
    else
        echo "WARNING: Could not remove offline repository cache."
        ERRORS=1
    fi

    if rm -f "$ROOT"/var/lib/apt/lists/*bibotto-repo*; then
        echo "Offline repository indexes removed."
    else
        echo "WARNING: Could not remove offline repository indexes."
        ERRORS=1
    fi

    exit "$ERRORS"
