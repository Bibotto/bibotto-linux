---
dontChroot: true
timeout: 120
verbose: true

script: |
    set -eu
    
    ROOT="${ROOT:?Calamares ROOT değişkeni tanımlı değil}"
    FSTAB="$ROOT/etc/fstab"
    CRYPTTAB="$ROOT/etc/crypttab"
    
    test -f "$FSTAB" || {
        echo "ERROR: Hedef sistemde fstab bulunamadı: $FSTAB"
        exit 1
    }
    
    MAPPER="$(awk '
        /^[[:space:]]*#/ || NF < 2 { next }
        $2 == "/" && $1 ~ /^\/dev\/mapper\// {
            sub(/^\/dev\/mapper\//, "", $1)
            print $1
            exit
        }
    ' "$FSTAB")"
    
    if [ -z "$MAPPER" ]; then
        echo "INFO: Kök dosya sistemi LUKS mapper üzerinden bağlanmıyor; işlem gerekmiyor."
        exit 0
    fi
    
    test -f "$CRYPTTAB" || {
        echo "ERROR: Şifrelenmiş kök bulundu ($MAPPER), ancak crypttab yok."
        exit 1
    }
    
    TMP="$(mktemp "${CRYPTTAB}.bibotto.XXXXXX")"
    trap 'rm -f "$TMP"' EXIT
    
    if ! awk -v mapper="$MAPPER" '
        BEGIN { OFS = " " }
    
        /^[[:space:]]*#/ || NF == 0 {
            print
            next
        }
    
        $1 == mapper {
            matches++
    
            if (NF < 4 || $4 == "") {
                $4 = "luks"
            } else {
                count = split($4, options, ",")
                found = 0
    
                for (i = 1; i <= count; i++) {
                    if (options[i] == "luks") {
                        found = 1
                    }
                }
    
                if (!found) {
                    $4 = $4 ",luks"
                }
            }
        }
    
        {
            for (i = 1; i <= NF; i++) {
                printf "%s%s", $i, (i == NF ? ORS : OFS)
            }
        }
    
        END {
            if (matches != 1) {
                exit 42
            }
        }
    ' "$CRYPTTAB" > "$TMP"; then
        echo "ERROR: crypttab içinde '$MAPPER' için tam olarak bir kayıt bulunamadı."
        exit 1
    fi
    
    chmod --reference="$CRYPTTAB" "$TMP"
    chown --reference="$CRYPTTAB" "$TMP"
    mv "$TMP" "$CRYPTTAB"
    trap - EXIT
    
    echo "SUCCESS: $MAPPER eşlemesine luks seçeneği eklendi."
