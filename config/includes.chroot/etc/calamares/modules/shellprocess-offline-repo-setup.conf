---
dontChroot: true
timeout: 1800
verbose: true

script: |
    set -eu

    ROOT="${ROOT:-}"
    MEDIA="/run/live/medium/bibotto-repo"
    BACKUP="$ROOT/var/tmp/bibotto-apt-sources-backup"
    REPO="$ROOT/var/cache/bibotto-repo"
    SOURCE_DIR="$ROOT/etc/apt/sources.list.d"
    OFFLINE_SOURCE="$SOURCE_DIR/bibotto-offline.list"
    MARKER="$BACKUP/.bibotto-transaction"

    # Validate all prerequisites before changing the target system.
    if [ -z "$ROOT" ] || [ ! -d "$ROOT" ]; then
        echo "ERROR: Target root is unavailable."
        exit 1
    fi

    test -d "$MEDIA"
    test -f "$MEDIA/Packages.gz"
    test -d "$MEDIA/pool"

    if [ -e "$BACKUP" ]; then
        echo "ERROR: Previous APT source backup already exists."
        exit 1
    fi

    if [ -e "$REPO" ]; then
        echo "ERROR: Offline repository cache already exists."
        exit 1
    fi

    if [ -e "$OFFLINE_SOURCE" ] || [ -e "$SOURCE_DIR/.bibotto-offline.list.tmp" ]; then
        echo "ERROR: Bibotto offline APT source path already exists."
        exit 1
    fi

    # Create the transaction marker before modifying APT configuration.
    mkdir -p "$ROOT/var/tmp" "$ROOT/var/cache" "$SOURCE_DIR"
    mkdir "$BACKUP"

    if ! : > "$MARKER"; then
        rmdir "$BACKUP" 2>/dev/null || true
        echo "ERROR: Could not create transaction marker."
        exit 1
    fi

    # Copy the repository. Emergency cleanup owns this path after the marker exists.
    mkdir "$REPO"
    cp -a "$MEDIA/." "$REPO/"

    # Move existing APT sources into the transaction backup.
    if [ -f "$ROOT/etc/apt/sources.list" ]; then
        mv "$ROOT/etc/apt/sources.list" "$BACKUP/"
    fi

    find "$SOURCE_DIR" -maxdepth 1 -type f \
        \( -name '*.list' -o -name '*.sources' \) \
        ! -name 'bibotto-offline.list' \
        -exec mv -t "$BACKUP" {} +

    # Publish the temporary source atomically.
    printf '%s\n' \
        'deb [trusted=yes] file:/var/cache/bibotto-repo ./' \
        > "$SOURCE_DIR/.bibotto-offline.list.tmp"

    mv "$SOURCE_DIR/.bibotto-offline.list.tmp" "$OFFLINE_SOURCE"

    # Remove stale package indexes before refreshing the local repository index.
    find "$ROOT/var/lib/apt/lists" -mindepth 1 -maxdepth 1 \
        -type f -delete

    chroot "$ROOT" apt-get update

    echo "Bibotto offline APT repository is ready."
