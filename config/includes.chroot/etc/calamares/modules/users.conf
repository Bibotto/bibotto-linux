# Bibotto Linux - User Configuration

defaultGroups:
    - name: sudo
      must_exist: true
      system: true

# Debian already configures the sudo group in /etc/sudoers.
# Do not generate an additional sudoers file.

setRootPassword: false

displayAutologin: false
doAutologin: false

passwordRequirements:
    minLength: 8
    maxLength: 64
    libpwquality:
        - minlen=8
        - maxrepeat=3
        - maxsequence=3

allowWeakPasswords: false
allowWeakPasswordsDefault: false

user:
    shell: /bin/bash
    forbidden_names:
        - root
        - nobody
    home_permissions: "o700"

hostname:
    location: EtcFile
    writeHostsFile: true
    template: "bibotto-${cpu}"
    forbidden_names:
        - localhost

allowActiveDirectory: false
