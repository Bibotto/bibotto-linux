# Bibotto Linux - Calamares Partition Configuration

# EFI System Partition
efi:
    mountPoint: "/boot/efi"
    recommendedSize: 512MiB
    minimumSize: 300MiB
    label: "BIBOTTO_EFI"

# BIOS + UEFI compatibility

# Filesystem defaults
defaultFileSystemType: btrfs
availableFileSystemTypes:
    - btrfs

# Swap
userSwapChoices:
    - none
initialSwapChoice: none

# Partitioning behavior
initialPartitioningChoice: none
allowManualPartitioning: true
lvm:
    enable: false

# Optional disk encryption
enableLuksAutomatedPartitioning: true
preCheckEncryption: false
luksGeneration: luks2
showNotEncryptedBootMessage: true

# Automatic partition layout
partitionLayout:
    - name: "BIBOTTO_BOOT"
      filesystem: ext4
      noEncrypt: true
      mountPoint: "/boot"
      size: 2G
      minSize: 1G

    - name: "BIBOTTO_ROOT"
      filesystem: btrfs
      noEncrypt: false
      mountPoint: "/"
      size: 100%
      minSize: 20G
