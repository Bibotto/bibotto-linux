# Bibotto Linux - Calamares Installer Configuration

modules-search:
    - local

instances:
    - id: offline-repo-setup
      module: shellprocess
      config: shellprocess-offline-repo-setup.conf

    - id: crypttab-luks-fix
      module: shellprocess
      config: shellprocess-crypttab-luks.conf

    - id: offline-repo-cleanup
      module: shellprocess
      config: shellprocess-offline-repo-cleanup.conf


oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
quit-at-end: false
prompt-install: true
dont-chroot: false

branding: bibotto

sequence:
    - show:
        - welcome
        - locale
        - keyboard
        - partition
        - users
        - packagechooser
        - summary

    - exec:
        - partition
        - mount
        - unpackfs
        - machineid
        - fstab
        - shellprocess@crypttab-luks-fix
        - locale
        - keyboard
        - localecfg
        - users
        - displaymanager
        - networkcfg
        - hwclock
        - services-systemd
        - shellprocess@offline-repo-setup
        - packages
        - shellprocess@offline-repo-cleanup
        - initramfscfg
        - initramfs
        - grubcfg
        - bootloader
        - umount

    - show:
        - finished
